# ReXGlue codegen input. Recompiled from the World release of After Burner Climax
# (retail XBLA package, default.xex 0.0.1.2, 2,293,760 bytes, SHA-1 a066b2d6...).
# Regenerate: put that default.xex in assets/ and run
#   rexglue codegen after_burner_climax_manifest.toml
# (see docs/building.md). Codegen also rewrites generated/rexglue.cmake.

[project]
name = "after_burner_climax"
sdk_version = "0.10.1"
game_root = "assets"

[entrypoint]
file_path = "assets/default.xex"
out_directory_path = "generated/default"
includes = ["after_burner_climax_overrides.toml"]
