name: Build Windows

# Every push to main or nativex builds the game (download it from the run's "Artifacts").
# Pushing a v* tag (e.g. by publishing a release) also attaches a zip to that release.
# No game files are used or produced: the exe makes its assets folder from the player's own package.
#
# The ReXGlue SDK is built from source at REXGLUE_SDK_REF with this repo's patches:
#   patches/rexglue-sdk/*.patch  -> git am in the SDK tree (NativeXRenderer's SDK changes, XMA skip, glue name fix)
#   patches/ffmpeg/*.patch       -> git apply in the SDK's thirdparty/FFmpeg (XMA skip metadata)
# See docs/building.md.
on:
  push:
    branches: [main, nativex]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  REXGLUE_SDK_REF: v0.10.1

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - name: Keep LF line endings, long paths
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - name: Checkout project
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM (clang 20+) and Ninja
        shell: pwsh
        run: |
          choco install llvm ninja -y --no-progress
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: MSVC environment (headers/libs for clang)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Toolchain versions
        shell: pwsh
        run: |
          clang++ --version
          cmake --version
          ninja --version

      # ---------- ReXGlue SDK (source tree, patched) ----------
      - name: Checkout ReXGlue SDK
        uses: actions/checkout@v4
        with:
          repository: rexglue/rexglue-sdk
          ref: ${{ env.REXGLUE_SDK_REF }}
          path: rexglue-sdk
          submodules: recursive

      - name: Apply SDK patches
        shell: pwsh
        working-directory: rexglue-sdk
        run: |
          git -c user.name=ci -c user.email=ci@local am --3way (Get-ChildItem ..\patches\rexglue-sdk\*.patch | Sort-Object Name | ForEach-Object FullName)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git log --oneline -12
          Push-Location thirdparty\FFmpeg
          foreach ($p in (Get-ChildItem ..\..\..\patches\ffmpeg\*.patch | Sort-Object Name)) {
            git apply --whitespace=nowarn $p.FullName
            if ($LASTEXITCODE -ne 0) { Write-Error "FFmpeg patch failed: $($p.Name)"; exit 1 }
          }
          git status --short
          Pop-Location

      # ---------- Game ----------
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: abc-recharged-win-amd64

      - name: Configure game
        shell: pwsh
        run: |
          cmake -S . -B out -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ `
            "-DCMAKE_C_FLAGS=-march=x86-64-v3" "-DCMAKE_CXX_FLAGS=-march=x86-64-v3" `
            "-DABC_BUILD=$("$env:GITHUB_SHA".Substring(0,7))" `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DABC_SKIP_CODEGEN=ON `
            -DREXGLUE_ENABLE_TRACY=OFF -DREXGLUE_USE_VULKAN=ON `
            "-DREXSDK_DIR=$env:GITHUB_WORKSPACE/rexglue-sdk"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build game
        shell: pwsh
        run: |
          cmake --build out --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item out\after_burner_climax.exe dist\
          # SDK built from source: its DLLs (rexruntime, the GPU plugin, SDL...) may sit in subfolders.
          Get-ChildItem out -Recurse -Filter *.dll | Where-Object { $_.FullName -notmatch 'CMakeFiles' } |
            Where-Object { -not (Test-Path ("dist\" + $_.Name)) } | Copy-Item -Destination dist\
          if (-not (Test-Path dist\rexruntime.dll)) { Write-Error "rexruntime.dll missing"; Get-ChildItem out -Recurse -Filter *.dll | Select FullName; exit 1 }
          Copy-Item packaging\README.txt dist\
          New-Item -ItemType Directory -Force dist\licenses | Out-Null
          Copy-Item LICENSE dist\licenses\afterburner-climax-recharged-LICENSE.txt
          Copy-Item rexglue-sdk\LICENSE dist\licenses\rexglue-sdk-LICENSE.txt
          Get-ChildItem rexglue-sdk\thirdparty -Directory | ForEach-Object {
            $lic = Get-ChildItem $_.FullName -File -Filter LICENSE* -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($lic) { Copy-Item $lic.FullName ("dist\licenses\LICENSE-" + $_.Name + ".txt") }
          }
          Get-ChildItem dist -Recurse | Select-Object -ExpandProperty FullName

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: after_burner_climax-win-amd64
          path: dist/

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $zip = "AfterBurnerClimaxRecharged-$env:GITHUB_REF_NAME-win64.zip"
          New-Item -ItemType Directory -Force pkg\AfterBurnerClimax | Out-Null
          Copy-Item -Recurse dist\* pkg\AfterBurnerClimax\
          Compress-Archive -Path pkg\AfterBurnerClimax -DestinationPath $zip
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
